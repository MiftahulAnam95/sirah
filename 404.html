<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Mengalihkan | Sirah Nabawiyah</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #171711;
        color: #eee8dc;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
      }
      p { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
      a { color: #eee8dc; }
    </style>
    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        var last = parts[parts.length - 1] || "";
        var base = "./";
        if (/^chapter-\d{2}$/.test(last)) {
          base = "../#/" + last;
        }
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <p>Mengalihkan ke arsip Sirah Nabawiyah…</p>
    <noscript><p><a href="./">Buka arsip Sirah Nabawiyah</a></p></noscript>
  </body>
</html>
